#cloud-config
# Sets a static IP for the Pi via systemd-networkd.
# Written to /etc/systemd/network/ which persists on the COS_PERSISTENT
# partition. A more specific [Match] wins over the existing DHCP config.
#
# Interface: end0 (Pi 4 built-in Ethernet)
# IP:        192.168.1.34/24
# Gateway:   192.168.1.1
# DNS:       1.1.1.1, 8.8.8.8
#
# To use a different IP for Pi 2, override just this file in its OEM config.

write_files:
  - path: /etc/systemd/network/10-end0-static.network
    permissions: "0644"
    content: |
      [Match]
      Name=end0

      [Network]
      Address=192.168.1.34/24
      Gateway=192.168.1.1
      DNS=1.1.1.1
      DNS=8.8.8.8
      LinkLocalAddressing=no

stages:
  network:
    - name: "Apply static IP for end0"
      commands:
        - |
          # Reload networkd so the new config takes effect immediately
          # (write_files runs at initramfs stage, this ensures it's live)
          systemctl restart systemd-networkd 2>/dev/null || true
