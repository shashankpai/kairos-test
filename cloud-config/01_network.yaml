#cloud-config
# Sets a static IP for the Pi via systemd-networkd.
# Written to /etc/systemd/network/ which persists via the Kairos
# overlay (write_files runs at initramfs stage before rootfs is
# made read-only).
#
# Interface: end0 (Pi 4 built-in Gigabit Ethernet)
# IP:        192.168.1.34/24
# Gateway:   192.168.1.1
# DNS:       192.168.1.1 (router), 8.8.8.8 (fallback)
#
# For Pi 2, create a separate OEM config that overwrites this file
# with its own IP address.

write_files:
  - path: /etc/systemd/network/10-end0.network
    permissions: "0600"
    content: |
      [Match]
      Name=end0

      [Network]
      DHCP=no
      Address=192.168.1.34/24
      Gateway=192.168.1.1
      DNS=192.168.1.1
      DNS=8.8.8.8
