#cloud-config
# Applies k8s manifests from the pulled repo to the k3s cluster.
#
# Uses the Kairos-native stage pattern:
# - network stage: applies manifests once k3s is up (after every boot)
# - reconcile stage: re-applies every 60 min to correct drift
#
# The k8s/ directory is downloaded to /oem/cloud-config-files/k8s/ by
# the curl+tar pull in 10_git-pull.yaml. This stage applies those
# manifests to the cluster, providing GitOps-style reconciliation
# without needing Flux or any extra controller.
#
# NOTE: We apply namespace.yaml FIRST, then the rest. kubectl apply -f
# processes files alphabetically (grafana.yaml before namespace.yaml),
# which fails because the namespace doesn't exist yet. We also don't
# use set -e for the apply because AlreadyExists errors are expected
# on re-runs (reconcile runs every 60 min).
stages:
  network:
    - name: "Apply k8s workloads"
      commands:
        - |
          # Wait for k3s API to be ready (up to 5 minutes)
          for i in $(seq 1 60); do
            if sudo k3s kubectl get nodes >/dev/null 2>&1; then break; fi
            sleep 5
          done
          K8S_DIR=/oem/cloud-config-files/k8s
          if [ -d "$K8S_DIR" ]; then
            # Apply namespace first so namespaced resources don't fail
            [ -f "$K8S_DIR/namespace.yaml" ] && sudo k3s kubectl apply -f "$K8S_DIR/namespace.yaml"
            # Apply the rest (errors are non-fatal — AlreadyExists is expected on re-runs)
            for f in "$K8S_DIR"/*.yaml; do
              [ "$(basename "$f")" = "namespace.yaml" ] && continue
              sudo k3s kubectl apply -f "$f" 2>&1 || true
            done
          fi
  reconcile:
    - name: "Reconcile k8s workloads"
      commands:
        - |
          K8S_DIR=/oem/cloud-config-files/k8s
          if [ -d "$K8S_DIR" ]; then
            [ -f "$K8S_DIR/namespace.yaml" ] && sudo k3s kubectl apply -f "$K8S_DIR/namespace.yaml"
            for f in "$K8S_DIR"/*.yaml; do
              [ "$(basename "$f")" = "namespace.yaml" ] && continue
              sudo k3s kubectl apply -f "$f" 2>&1 || true
            done
          fi
