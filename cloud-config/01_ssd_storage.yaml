#cloud-config
# SSD configuration — reconciliation and local-path provisioner setup
#
# NOTE: The fs stage (SSD detection, formatting, mounting) is baked into
# the flash-time config (build/cloud-config-pi1.yaml) so it runs FIRST,
# before k3s starts. This file handles the reconciliation and provisioner
# setup that runs on every boot.
#
# Uses partition LABEL "kairos-ssd" (not UUID) so the same cloud-config
# works on every Pi in the fleet — each Pi's SSD is formatted with the
# same label. This is the Kairos-native best practice for per-node
# local storage on small edge clusters.
#
# IMPORTANT: On Kairos, the rootfs is read-only. /mnt is on the read-only
# rootfs, so we can't create mount points there. We use /usr/local/ssd
# instead, which is on the COS_PERSISTENT partition (writable).
#
# Why not Longhorn? Longhorn is a distributed block storage system that
# needs 3+ nodes for quorum and ~1GB RAM overhead. For a 2-Pi edge
# cluster where each Pi has its own SSD, local-path provisioner + SSD
# is simpler and more resource-efficient. Longhorn is the upgrade path
# when the fleet grows to 5+ nodes with storage on each.
#
# Two things happen here:
# 1. network stage: patches the local-path provisioner ConfigMap to use
#    /usr/local/ssd/k3s-storage as the storage path (after k3s is up)
# 2. reconcile stage: re-applies the provisioner patch every 60 min (drift correction)

stages:
  network:
    - name: "Configure local-path provisioner to use SSD"
      commands:
        - |
          # Wait for k3s API to be ready
          for i in $(seq 1 60); do
            if sudo k3s kubectl get nodes >/dev/null 2>&1; then break; fi
            sleep 5
          done
          # Patch the local-path provisioner to use the SSD for all PVCs.
          # This is idempotent — safe to run on every boot and reconcile.
          # Only patch if the SSD is actually mounted.
          if mountpoint -q /usr/local/ssd; then
            sudo k3s kubectl patch configmap local-path-config -n kube-system \
              --type='json' \
              -p='[{"op":"replace","path":"/data/config.json","value":"{\"nodePathMap\":[{\"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\"paths\":[\"/usr/local/ssd/k3s-storage\"]}]}"}]' \
              2>&1 || true
          fi
  reconcile:
    - name: "Reconcile local-path provisioner to SSD"
      commands:
        - |
          if mountpoint -q /usr/local/ssd; then
            sudo k3s kubectl patch configmap local-path-config -n kube-system \
              --type='json' \
              -p='[{"op":"replace","path":"/data/config.json","value":"{\"nodePathMap\":[{\"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\"paths\":[\"/usr/local/ssd/k3s-storage\"]}]}"}]' \
              2>&1 || true
          fi
